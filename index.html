<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vérification ATECH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f4f6fb;padding:12px;min-height:100vh}
.card{background:#fff;border-radius:16px;max-width:420px;margin:16px auto;overflow:hidden;
      box-shadow:0 2px 16px rgba(0,0,0,.08)}
/* En-tête commerce */
.biz-hdr{padding:18px 20px 14px;display:flex;align-items:center;gap:14px;
         border-bottom:1px solid #f0f4f8}
.biz-logo{width:52px;height:52px;border-radius:10px;object-fit:contain;
          border:1px solid #eef2f7;flex-shrink:0}
.biz-name{font-size:17px;font-weight:700;color:#111;line-height:1.3}
/* Statut */
.status-ok{background:#f0fdf4;color:#1a7f37;padding:11px 20px;font-size:15px;
           font-weight:700;display:flex;align-items:center;gap:8px;
           border-bottom:1px solid #bbf7d0}
.status-cancel{background:#fee2e2;color:#991b1b;padding:11px 20px;font-size:15px;
               font-weight:700;display:flex;align-items:center;gap:8px;
               border-bottom:1px solid #fca5a5}
.banner-danger{padding:11px 20px;font-size:13px;color:#991b1b;font-weight:600;
               border-bottom:1px solid #fca5a5;line-height:1.5}
/* Faits documentaires (GRAND) */
.facts{padding:18px 20px 14px;background:#f8fafc;border-bottom:1px solid #f0f4f8}
.fact-amount{font-size:34px;font-weight:800;color:#111;margin-bottom:14px;
             letter-spacing:-1px;line-height:1}
.fact-row{display:flex;justify-content:space-between;padding:6px 0;font-size:15px;
          border-bottom:1px solid #eef2f7}
.fact-row:last-child{border:none}
.fact-lbl{color:#666}
.fact-val{font-weight:600;color:#111;text-align:right;overflow-wrap:break-word;max-width:60%}
/* Phrase de comparaison */
.compare{padding:12px 20px;font-size:13px;color:#374151;background:#fffbeb;
         border-bottom:1px solid #fde68a;line-height:1.5}
/* Notices et badge signé */
.notice{padding:10px 20px;font-size:13px;color:#1e40af;background:#eff6ff;
        border-bottom:1px solid #bfdbfe}
.signed{padding:9px 20px;font-size:13px;color:#166534;background:#f0fdf4;
        border-bottom:1px solid #bbf7d0;display:flex;align-items:center;gap:6px}
/* Coordonnées (bas, petit) */
.contact{padding:12px 20px 8px;border-top:1px solid #f0f4f8}
.contact-ttl{font-size:11px;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
.contact-line{font-size:12px;color:#555;padding:1px 0}
/* Pied de page */
.foot{text-align:center;padding:10px;font-size:11px;color:#aaa;border-top:1px solid #f0f4f8}
/* Chargement */
.simple-wrap{display:flex;align-items:flex-start;justify-content:center;padding:16px}
.simple{background:#fff;border-radius:16px;max-width:400px;width:100%;
        margin:24px auto;padding:28px;box-shadow:0 2px 16px rgba(0,0,0,.08)}
.atech-logo{color:#123A80;font-weight:700;font-size:17px;margin-bottom:24px;
            display:flex;align-items:center;gap:8px}
.badge{font-size:48px;line-height:1;margin-bottom:8px}
.s-title{font-size:20px;font-weight:700;margin-bottom:20px}
.ok{color:#1a7f37}.warn{color:#b45309}.err{color:#b91c1c}
.banner{background:#fef3c7;border:1px solid #f59e0b;border-radius:10px;
        padding:12px 14px;margin-top:16px;font-size:13px;color:#92400e;line-height:1.5}
.spin{display:flex;align-items:center;justify-content:center;gap:12px;
      padding:32px 0;color:#666;font-size:15px}
.spinner{width:28px;height:28px;border:3px solid #e0e0e0;border-top-color:#123A80;
         border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="root"></div>

<script>
// URL de l'Edge Function (publique, sans secret).
const EDGE_URL = 'https://zjowlunqrjdizviqlvfx.supabase.co/functions/v1/verify';

const MONTH_FR = ['janvier','février','mars','avril','mai','juin',
                  'juillet','août','septembre','octobre','novembre','décembre'];

const TYPE_FR = {
  invoice: 'Facture', quote: 'Devis', proforma: 'Proforma',
  delivery_note: 'Bon de livraison', receipt: 'Reçu',
  purchase_order: 'Bon de commande', disbursement: 'Décaissement',
};

function getStatusLabel(type, docStatus) {
  if (docStatus === 'cancelled') return null;
  if (type === 'invoice') {
    if (docStatus === 'paid') return 'Payée';
    if (docStatus === 'partiallyPaid') return 'Partiellement payée';
    return 'Impayée';
  }
  if (type === 'receipt') return 'Payé';
  if (type === 'purchase_order') {
    if (docStatus === 'partiallyReceived') return 'Partiellement reçu';
    if (docStatus === 'received') return 'Reçu';
    if (docStatus === 'closed') return 'Clôturé';
    return 'Émis';
  }
  return 'Émis';
}

const NO_PAYMENT_TYPES = new Set(['quote', 'proforma', 'purchase_order']);

function esc(s) {
  return String(s ?? '')
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDate(iso) {
  if (!iso) return '–';
  const d = new Date(iso);
  if (isNaN(d)) return esc(iso);
  return d.getUTCDate() + ' ' + MONTH_FR[d.getUTCMonth()] + ' ' + d.getUTCFullYear();
}

function formatGnf(n) {
  return new Intl.NumberFormat('fr-FR').format(n) + ' GNF';
}

// ── Rendu page simple (pending, unknown, erreur) ──────────────────────────────

function renderSimple(badge, titleCss, title, bannerHtml) {
  return `<div class="simple-wrap"><div class="simple">
<div class="atech-logo">
<svg viewBox="0 0 28 28" fill="none" width="28" height="28">
<rect width="28" height="28" rx="7" fill="#123A80"/>
<path d="M7 14h14M14 7v14" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
ATECH Boutik</div>
<div class="badge">${badge}</div>
<div class="s-title ${titleCss}">${esc(title)}</div>
${bannerHtml}
<div class="foot">Vérifié par ATECH-AOB</div>
</div></div>`;
}

// ── Rendu page document (authentique / annulé) ────────────────────────────────

function renderDoc(data) {
  const biz = data.business;
  const cancelled = data.status === 'cancelled';
  const totalNum = typeof data.total === 'string' ? parseInt(data.total, 10) : data.total;

  // En-tête commerce
  const bizHdr = (biz?.name || biz?.logoUrl) ? `
<div class="biz-hdr">
  ${biz.logoUrl ? `<img src="${esc(biz.logoUrl)}" class="biz-logo" alt="">` : ''}
  ${biz.name ? `<div class="biz-name">${esc(biz.name)}</div>` : ''}
</div>` : '';

  // Statut
  const statusHtml = cancelled
    ? '<div class="status-cancel">⚠️ Document ANNULÉ</div>'
    : '<div class="status-ok">✅ Document authentique</div>';

  // Bannière annulé
  const cancelBanner = cancelled
    ? `<div class="banner-danger">Ce document a été annulé et n'a plus de valeur commerciale.</div>`
    : '';

  // Faits (montant GRAND, puis lignes)
  const statusLbl = getStatusLabel(data.type, data.docStatus || (cancelled ? 'cancelled' : ''));
  const factsHtml = `<div class="facts">
  <div class="fact-amount">${formatGnf(totalNum)}</div>
  <div class="fact-row"><span class="fact-lbl">N°</span><span class="fact-val">${esc(data.number)}</span></div>
  <div class="fact-row"><span class="fact-lbl">Date</span><span class="fact-val">${formatDate(data.issuedAt)}</span></div>
  <div class="fact-row"><span class="fact-lbl">Type</span><span class="fact-val">${esc(TYPE_FR[data.type] || data.type)}</span></div>
  ${statusLbl != null ? `<div class="fact-row"><span class="fact-lbl">Statut</span><span class="fact-val">${esc(statusLbl)}</span></div>` : ''}
</div>`;

  // Phrase de comparaison (seulement si authentique)
  const compareHtml = cancelled ? '' :
    `<div class="compare">⚠️ <strong>Comparez ces informations avec votre document :</strong>
     en cas de différence, il s'agit d'un faux.</div>`;

  // Notice non-paiement
  const noticeHtml = NO_PAYMENT_TYPES.has(data.type)
    ? `<div class="notice">ℹ️ Ce document n'est pas une preuve de paiement.</div>`
    : '';

  // Badge signé
  const signedHtml = data.signed
    ? '<div class="signed">🔒 Signature vérifiée — document signé numériquement</div>'
    : '';

  // Coordonnées (bas, petit)
  const lines = [];
  if (biz?.phone)   lines.push(`📞 ${esc(biz.phone)}`);
  if (biz?.address) lines.push(`📍 ${esc(biz.address)}`);
  if (biz?.city)    lines.push(esc(biz.city));
  if (biz?.email)   lines.push(`✉ ${esc(biz.email)}`);
  if (biz?.nif)     lines.push(`NIF : ${esc(biz.nif)}`);
  if (biz?.rccm)    lines.push(`RCCM : ${esc(biz.rccm)}`);

  const contactHtml = lines.length > 0 ? `<div class="contact">
  <div class="contact-ttl">Coordonnées du commerce</div>
  ${lines.map(l => `<div class="contact-line">${l}</div>`).join('\n  ')}
</div>` : '';

  return `<div class="card">
${bizHdr}
${statusHtml}
${cancelBanner}
${factsHtml}
${compareHtml}
${noticeHtml}
${signedHtml}
${contactHtml}
<div class="foot">Vérifié par ATECH-AOB</div>
</div>`;
}

// ── Vérification ──────────────────────────────────────────────────────────────

async function verify() {
  const root = document.getElementById('root');
  root.innerHTML = renderSimple(
    '<div class="spin"><div class="spinner"></div>Vérification en cours…</div>',
    '', '', '',
  );

  const p = new URLSearchParams(window.location.search);
  const id   = p.get('id');
  const hmac = p.get('hmac');
  const d    = p.get('d');

  if (!id) {
    root.innerHTML = renderSimple('❌', 'err', 'Document non reconnu',
      '<div class="banner">Ce lien ne correspond à aucun document ATECH.</div>');
    return;
  }

  // Construction de l'URL selon le type de QR :
  // - ancien QR (hmac) : passe hmac pour rétrocompatibilité
  // - nouveau QR : passe d (date) si disponible
  let url = EDGE_URL + '?id=' + encodeURIComponent(id);
  if (hmac) {
    url += '&hmac=' + encodeURIComponent(hmac);
  } else if (d) {
    url += '&d=' + encodeURIComponent(d);
  }

  let data;
  try {
    const resp = await fetch(url, { headers: { Accept: 'application/json' } });
    data = await resp.json();
  } catch (_) {
    root.innerHTML = renderSimple('⚠️', 'warn', 'Vérification momentanément indisponible',
      '<div class="banner">Erreur réseau. Réessayez dans quelques instants.</div>');
    return;
  }

  // ── En attente de synchronisation ────────────────────────────────────────
  if (data.status === 'pending') {
    root.innerHTML = renderSimple('⏳', 'warn', 'Document en attente de synchronisation',
      `<div class="banner">Ce document a été créé hors ligne et n'est pas encore synchronisé.
       Réessayez dans quelques heures ou contactez l'émetteur.<br><br>
       <strong>Ceci n'est pas une preuve d'authenticité.</strong></div>`);
    return;
  }

  // ── Document inconnu ──────────────────────────────────────────────────────
  if (!data.valid || data.status === 'unknown') {
    root.innerHTML = renderSimple('❌', 'err', 'Document non reconnu',
      '<div class="banner">Aucun document ATECH ne correspond à ce code.</div>');
    return;
  }

  // ── Mettre à jour le titre de la page avec le nom du commerce ─────────────
  if (data.business?.name) {
    document.title = data.business.name + ' – ATECH';
  }

  root.innerHTML = renderDoc(data);
}

verify();
</script>
</body>
</html>
